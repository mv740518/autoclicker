name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若已存在同版本发布则先删除，保证可重复构建
          gh release delete v1.7 -y || true
          git push --delete origin v1.7 || true
          gh release create v1.7 \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.7" \
            --notes "1) 选点体验重做：悬浮「⊕ 选点」开启按钮 → 在目标 App 中点一下出现黄色十字光标 → 点「保存」确认（可「重选」重选），保存后悬浮按钮仍在可继续添加下一个位置；光标明确标识已选/未选。2) 延续 v1.6 的 Android 12+ 受限设置修复（应用信息直达 + 未知来源检测提示）。" \
            --latest
