name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若已存在同版本发布则先删除，保证可重复构建
          gh release delete v1.6 -y || true
          git push --delete origin v1.6 || true
          gh release create v1.6 \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.6" \
            --notes "针对 Android 12+ 侧载 APK 被「受限设置」拦截、无法开启无障碍服务的根因修复：权限卡片新增「应用信息」直达按钮与「允许受限设置」引导；自动检测未知来源安装并红字提示。另提供电脑端 adb install 一劳永逸方案（见更新说明）。" \
            --latest
