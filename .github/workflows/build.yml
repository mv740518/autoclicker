name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若已存在同版本发布则先删除，保证可重复构建
          gh release delete v1.7.2 -y || true
          git push --delete origin v1.7.2 || true
          gh release create v1.7.2 \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.7.2" \
            --notes "选点遮罩顶部的说明条改为可折叠：默认展开看说明，点「收起」缩成小按钮不再遮挡要选的位置；点「说明」可重新展开。悬浮窗权限缺失时的 FAB 跳转与开启 Toast 提示保留。" \
            --latest
