name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若已存在同版本发布则先删除，保证可重复构建
          gh release delete v1.7.1 -y || true
          git push --delete origin v1.7.1 || true
          gh release create v1.7.1 \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.7.1" \
            --notes "修复：悬浮窗权限（Overlay）未授予时，「添加步骤」会静默失败、选点悬浮按钮不弹出。现改为：未授予悬浮窗权限时点「添加步骤」直接跳去开权限；开启选点后弹 Toast 提示确认。选点流程不变（悬浮「⊕ 选点」→ 点位置出黄色十字光标 → 保存/重选）。" \
            --latest
